# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Fields mirror the zod schemas in src/content.config.ts; the build rejects anything invalid.
# tests/unit/cms-config.test.ts checks the two stay in step.
# Fields defined once with &anchors are reused below with *aliases.

backend:
  name: github
  repo: uenlkr4e/discoverTurkey
  branch: main
  # REQUIRED: URL of your Sveltia CMS Authenticator worker (see docs/deployment.md).
  base_url: https://sveltia-cms-auth.example.workers.dev

# Every change becomes a branch and pull request: Draft → In review → Ready → published by merging.
publish_mode: editorial_workflow

# REQUIRED: the production site URL, used for "view on site" links.
site_url: https://www.discoverturkey.example
# Global media library. Entries use the collection-level settings below so image paths are
# written relative to the entry file (../images/x.jpg), which is how Astro resolves them.
media_folder: /src/content/images
public_folder: /src/content/images

slug:
  encoding: ascii
  clean_accents: true
# Translations: German entries are stored in a "de" subfolder of each collection, e.g.
# src/content/destinations/de/istanbul.md, which is where the site reads them. Keep locales
# in step with src/i18n/locales.ts. See docs/translations.md.
i18n:
  structure: multiple_folders
  locales:
    - en
    - de
  default_locale: en
  omit_default_locale_from_file_path: true

collections:
  - name: destinations
    label: Destinations
    label_singular: Destination
    folder: src/content/destinations
    media_folder: /src/content/images
    public_folder: ../images
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{status}})'
    preview_path: 'destinations/{{slug}}/'
    fields:
      - &title { name: title, label: Title, widget: string, hint: 'Unique across the site.', i18n: true }
      - &summary
        name: summary
        label: Summary
        widget: text
        hint: '50–160 characters. Used on cards and as the default meta description.'
        pattern: ['^[\s\S]{50,160}$', 'Must be 50–160 characters']
        i18n: true
      - &heroImage
        name: heroImage
        label: Hero image
        widget: object
        fields:
          - { name: src, label: Image, widget: image, hint: 'Landscape, at least 1600px wide.', i18n: duplicate }
          - { name: alt, label: Alt text, widget: string, hint: 'Describe what the photo shows for people who cannot see it.', i18n: true }
          - name: credit
            label: Credit
            widget: object
            hint: 'Where the image came from and its licence. Only use images whose licence allows commercial use.'
            fields:
              - { name: author, label: Photographer or author, widget: string, i18n: duplicate }
              - { name: sourceUrl, label: Source URL, widget: string, pattern: ['^https?://', 'Must be a URL'], i18n: duplicate }
              - { name: license, label: Licence, widget: string, hint: 'e.g. CC BY-SA 4.0, Unsplash License, Own photo', i18n: duplicate }
            i18n: duplicate
        i18n: true
      - { name: region, label: Region, widget: relation, collection: taxonomies, file: regions, value_field: '{{regions.*.id}}', display_fields: ['{{regions.*.name}}'], search_fields: ['{{regions.*.name}}'], i18n: duplicate }
      - &interests { name: interests, label: Interests, widget: relation, collection: taxonomies, file: interests, multiple: true, min: 1, value_field: '{{interests.*.id}}', display_fields: ['{{interests.*.name}}'], search_fields: ['{{interests.*.name}}'], i18n: duplicate }
      - name: bestTimeToVisit
        label: Best time to visit
        widget: object
        fields:
          - { name: summary, label: Summary, widget: string, i18n: true }
          - { name: spring, label: Spring, widget: text, i18n: true }
          - { name: summer, label: Summer, widget: text, i18n: true }
          - { name: autumn, label: Autumn, widget: text, i18n: true }
          - { name: winter, label: Winter, widget: text, i18n: true }
        i18n: true
      - { name: suggestedDuration, label: Suggested stay, widget: string, hint: 'e.g. 3–4 days', i18n: true }
      - name: coordinates
        label: Coordinates
        widget: object
        hint: 'Decimal degrees, e.g. 41.0082 and 28.9784 for Istanbul.'
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float, min: 35, max: 43, i18n: duplicate }
          - { name: lng, label: Longitude, widget: number, value_type: float, min: 25, max: 45, i18n: duplicate }
        i18n: duplicate
      - name: attractions
        label: Attractions
        label_singular: Attraction
        widget: list
        min: 1
        fields:
          - { name: name, label: Name, widget: string, i18n: true }
          - { name: description, label: Description, widget: markdown, i18n: true }
        i18n: true
      - { name: gettingThere, label: Getting there, widget: markdown, i18n: true }
      - { name: gettingAround, label: Getting around, widget: markdown, i18n: true }
      - { name: foodAndExperiences, label: Food and local experiences, widget: markdown, i18n: true }
      - &body { name: body, label: Body, widget: markdown, i18n: true }
      - { name: featured, label: Featured on homepage, widget: boolean, default: false, i18n: duplicate }
      - name: seasonalHighlight
        label: Seasonal highlight
        widget: object
        required: false
        hint: 'Optional. Shown on the homepage during this season.'
        fields:
          - { name: season, label: Season, widget: select, options: [spring, summer, autumn, winter], i18n: true }
          - { name: text, label: Text, widget: string, i18n: true }
        i18n: true
      - &tags { name: tags, label: Tags, widget: list, required: false, hint: 'Lower-case keywords used to suggest related content.', i18n: duplicate }
      - &relatedDestinations { name: relatedDestinations, label: Related destinations, widget: relation, collection: destinations, multiple: true, required: false, value_field: '{{slug}}', search_fields: [title], display_fields: [title], i18n: duplicate }
      - &relatedGuides { name: relatedGuides, label: Related guides, widget: relation, collection: guides, multiple: true, required: false, value_field: '{{slug}}', search_fields: [title], display_fields: [title], i18n: duplicate }
      - &relatedItineraries { name: relatedItineraries, label: Related itineraries, widget: relation, collection: itineraries, multiple: true, required: false, value_field: '{{slug}}', search_fields: [title], display_fields: [title], i18n: duplicate }
      - &author { name: author, label: Author, widget: relation, collection: authors, value_field: '{{slug}}', search_fields: [name], display_fields: [name], i18n: duplicate }
      - &status
        name: status
        label: Publication status
        widget: select
        default: draft
        options:
          - { label: Draft, value: draft }
          - { label: In review, value: in-review }
          - { label: Published, value: published }
        hint: 'Published entries need a reviewer and review date, or the build fails.'
        i18n: true
      - &reviewedBy { name: reviewedBy, label: Reviewed by, widget: string, required: false, hint: 'Editor who checked every fact on this page.', i18n: true }
      - &reviewedAt { name: reviewedAt, label: Review date, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false, i18n: true }
      - &publishedAt { name: publishedAt, label: First published, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false, i18n: true }
      - &updatedAt { name: updatedAt, label: Last updated, widget: datetime, time_format: false, format: 'YYYY-MM-DD', i18n: true }
      - &seoTitle { name: seoTitle, label: SEO title, widget: string, required: false, hint: 'Optional, max 60 characters. Defaults to the title.', pattern: ['^.{0,60}$', 'Max 60 characters'], i18n: true }
      - &seoDescription { name: seoDescription, label: SEO description, widget: text, required: false, hint: 'Optional, 50–160 characters. Defaults to the summary.', i18n: true }
    i18n: true

  - name: guides
    label: Travel tips
    label_singular: Guide
    folder: src/content/guides
    media_folder: /src/content/images
    public_folder: ../images
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{status}})'
    fields:
      - *title
      - *summary
      - *heroImage
      - { name: category, label: Category, widget: relation, collection: taxonomies, file: guideCategories, value_field: '{{categories.*.id}}', display_fields: ['{{categories.*.name}}'], search_fields: ['{{categories.*.name}}'], i18n: duplicate }
      - *body
      - name: factsToVerify
        label: Facts to verify
        widget: list
        required: false
        hint: 'Time-sensitive claims (prices, hours, rules) the reviewer must check against official sources. Shown only on draft previews.'
        i18n: true
      - *tags
      - *relatedDestinations
      - *relatedGuides
      - *relatedItineraries
      - *author
      - *status
      - *reviewedBy
      - *reviewedAt
      - *publishedAt
      - *updatedAt
      - *seoTitle
      - *seoDescription
    i18n: true

  - name: itineraries
    label: Itineraries
    label_singular: Itinerary
    folder: src/content/itineraries
    media_folder: /src/content/images
    public_folder: ../images
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{status}})'
    preview_path: 'itineraries/{{slug}}/'
    fields:
      - *title
      - *summary
      - *heroImage
      - { name: days, label: Number of days, widget: number, value_type: int, min: 1, max: 30, i18n: duplicate }
      - *interests
      - name: stops
        label: Day-by-day stops
        label_singular: Stop
        widget: list
        min: 1
        fields:
          - { name: day, label: Day, widget: number, value_type: int, min: 1, i18n: duplicate }
          - { name: destination, label: Destination, widget: relation, collection: destinations, value_field: '{{slug}}', search_fields: [title], display_fields: [title], i18n: duplicate }
          - { name: title, label: Title, widget: string, i18n: true }
          - { name: plan, label: Plan, widget: markdown, i18n: true }
        i18n: true
      - *body
      - *tags
      - *relatedDestinations
      - *relatedGuides
      - *relatedItineraries
      - *author
      - *status
      - *reviewedBy
      - *reviewedAt
      - *publishedAt
      - *updatedAt
      - *seoTitle
      - *seoDescription
    i18n: true

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    preview_path: '{{slug}}/'
    fields:
      - *title
      - *summary
      - *body
      - { name: inSitemap, label: Include in sitemap, widget: boolean, default: true, i18n: duplicate }
      - *status
      - *reviewedBy
      - *reviewedAt
      - *updatedAt
    i18n: true

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    extension: yaml
    format: yaml
    create: true
    slug: '{{slug}}'
    identifier_field: name
    media_folder: /src/content/images
    public_folder: ../images
    fields:
      - { name: name, label: Name, widget: string, hint: 'Use your real name: named authors with first-hand experience are trusted more by readers and search engines.' }
      - name: kind
        label: Type
        widget: select
        default: person
        options:
          - { label: Person, value: person }
          - { label: Team or organisation, value: organization }
      - { name: role, label: Role, widget: string, hint: 'e.g. Founder and editor, Istanbul-based travel writer' }
      - { name: bio, label: Bio, widget: text, hint: 'Who you are and why you know Turkey: where you live, how long you have travelled there, what you specialise in. The first 160 characters are used as the page description.' }
      - name: photo
        label: Photo
        widget: object
        required: false
        fields:
          - { name: src, label: Image, widget: image, hint: 'A clear, square-ish photo of you.' }
          - { name: alt, label: Alt text, widget: string, hint: 'e.g. Ayşe Demir on a ferry on the Bosphorus' }
      - { name: location, label: Location, widget: string, required: false, hint: 'e.g. Lives in İzmir' }
      - { name: knowsAbout, label: Specialities, widget: list, required: false, hint: 'Topics you know well, e.g. Istanbul, Lycian Way, Turkish food' }
      - name: links
        label: Profiles elsewhere
        widget: list
        required: false
        hint: 'Your Instagram, YouTube, personal site and so on. Helps readers and search engines confirm who you are.'
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string, pattern: ['^https?://', 'Must be a URL'] }

  - name: taxonomies
    label: Regions, interests and categories
    files:
      - name: regions
        label: Regions
        file: src/data/regions.yaml
        fields:
          - name: regions
            label: Regions
            widget: list
            root: true
            fields: &taxonomyFields
              - { name: id, label: ID, widget: string, hint: 'Lower-case, hyphenated. Used in URLs; do not change once published.' }
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text, hint: '50–160 characters.' }
              - name: translations
                label: Translations
                widget: object
                required: false
                collapsed: true
                hint: 'Name and description shown on translated pages. Without one, the English text is used.'
                fields:
                  - name: de
                    label: German
                    widget: object
                    required: false
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: description, label: Description, widget: text, hint: '50–160 characters.' }
      - name: interests
        label: Interests
        file: src/data/interests.yaml
        fields:
          - { name: interests, label: Interests, widget: list, root: true, fields: *taxonomyFields }
      - name: guideCategories
        label: Guide categories
        file: src/data/guide-categories.yaml
        fields:
          - { name: categories, label: Categories, widget: list, root: true, fields: *taxonomyFields }
